server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html nunca pode ser cacheado — é ele quem referencia o hash do bundle JS/CSS
    # atual. Sem isso, clientes agressivos em cache (Teams mobile, em especial) ficam presos
    # numa versão antiga da SPA indefinidamente mesmo após um deploy novo no servidor.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri /index.html;
    }

    # Assets com hash no nome (Vite) mudam de nome a cada build — seguro cachear por muito
    # tempo, já que uma URL antiga nunca é reaproveitada por um build novo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # O bloco acima só casa com a URL literal "/index.html". Quem abre a raiz do app ou entra
    # direto numa rota do SPA recebia o mesmo index.html por aqui, mas SEM os cabeçalhos de
    # no-cache — e o navegador então aplica cache heurístico (só Last-Modified na resposta),
    # prendendo o usuário num index.html velho que aponta para hashes de bundle que já não são os
    # atuais. Era o caminho pelo qual "outros usuários continuam na versão antiga" mesmo depois de
    # um deploy novo. sw.js entra na mesma regra: se o próprio service worker vier do cache, ele
    # nunca chega a instalar a versão nova para então aplicar skipWaiting/clientsClaim.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri $uri/ /index.html;
    }
}
