<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carimbo da foto</title>
<style>
:root{--bg:#f6f4ef;--tx:#1a1a1a;--marsala:#670000}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161414;--tx:#eee}}
:root[data-theme="dark"]{--bg:#161414;--tx:#eee}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}
h1{font-size:20px;color:var(--marsala);margin:0 0 6px}p{margin:0 0 16px;max-width:760px;line-height:1.5}
canvas{width:100%;max-width:800px;height:auto;border-radius:8px;display:block}
</style></head><body>
<h1>Carimbo da foto do G-SST (igual ao G-QUALI)</h1>
<p>Este é um exemplo com dados fictícios. O carimbo fica no canto superior direito, com texto branco, contorno e sombra suaves. As linhas são: data e hora, endereço (quando o Azure Maps estiver ligado), coordenadas, altitude e, por último, a obra e o local.</p>
<canvas id="c" width="1600" height="1200"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const g=x.createLinearGradient(0,0,0,1200);g.addColorStop(0,'#9db4c8');g.addColorStop(.55,'#cfc6b4');g.addColorStop(1,'#7d6f5c');
x.fillStyle=g;x.fillRect(0,0,1600,1200);x.fillStyle='#b9b2a3';x.fillRect(200,500,700,700);x.fillStyle='#8a7f6d';for(let i=0;i<6;i++)x.fillRect(240,540+i*100,620,8);
const L=['30 de out. de 2026, 14:40:05','Rua Exemplo, 123','Centro','São Paulo SP','01000-000','Brasil','Lat: -23.550520°  Long: -46.633308°','Alt: 760 m  (±8 m)','Obra Exemplo · Bloco A'];
let f=Math.max(12,Math.round(1600/28));const lh=()=>Math.round(f*1.3);
for(let t=0;t<14;t++){x.font=f+'px sans-serif';const m=Math.max(...L.map(l=>x.measureText(l).width));if((m<=1600*.9-f&&L.length*lh()+f*2<=1200*.6)||f<=8)break;f=Math.max(8,Math.floor(f*.92));}
x.font=f+'px sans-serif';const mg=Math.round(1600*.045);x.textAlign='right';x.textBaseline='top';x.lineJoin='round';x.lineWidth=Math.max(1,Math.round(f/11));
x.strokeStyle='rgba(0,0,0,.45)';x.shadowColor='rgba(0,0,0,.55)';x.shadowBlur=Math.max(2,Math.round(f/5));x.shadowOffsetY=Math.max(1,Math.round(f/16));x.fillStyle='#fff';
let y=Math.round(f*1.1);for(const l of L){x.strokeText(l,1600-mg,y);x.fillText(l,1600-mg,y);y+=lh();}
</script></body></html>
